id: duracao-por-profissional
descricao: >
  A duração do profissional vence a do tenant na hora de reservar. Com a
  Marina em 60 min, um agendamento às 09:00 ocupa até as 10:00 — marcar
  09:30 em cima dele é o bug dos dois pacientes na mesma cadeira, achado
  em produção na clínica.

  Não confundir com o espaçamento da oferta: horários de início de 30 em 30
  para profissional de 60 é comportamento PRETENDIDO (calendar.test.js:441).
  O que o banco denuncia é a cadeira dobrada, não o passo da lista.

tenant:
  timezone: America/Sao_Paulo
  slot_interval_minutes: 30
  service_duration_minutes: 30
  horario_manha_inicio: "08:00"
  horario_manha_fim: "12:00"
  profissionais:
    - nome: Marina
      service_duration_minutes: 60

agenda_ocupada: []

turnos:
  - "quero marcar com a marina na segunda-feira da semana que vem, às 9h"
  - "confirma, meu nome é Ana Paula"
  - "quero marcar mais um horário com a marina, às 9h30 no mesmo dia"
  - "pode confirmar esse também"

verificacoes:
  # Duas metades da mesma regra, independentes:
  #   duracao_minutos: 60  -> a duração dela venceu a do tenant (30)
  #   agendamentos: 1      -> o 09:30 NÃO virou linha, a cadeira não dobrou
  agendamentos: 1
  agendamento:
    duracao_minutos: 60
    horario: "09:00"
    profissional: Marina
    telefone: contato
  # Tetos = 2 × o máximo medido em 3 passadas (2026-08-28,
  # google/gemini-3.7-flash): 12/50.446, 13/56.657, 13/55.630 — máximo de
  # 13 chamadas e 56.657 tokens de prompt. Valores exatos do dobro, sem
  # arredondar: número redondo esconde de onde veio.
  #
  # A base anterior (11 chamadas / 42.645 tokens, medida em 2026-08-25) foi
  # tirada do comportamento COM o bug do nome_profissional: o modelo omitia
  # o campo e resolvia a conversa por um caminho mais barato. Os tetos de
  # 22/86.000 estavam, portanto, ancorados no lugar errado — folga contra um
  # custo que o cenário corrigido não tem mais. Com as quatro camadas em pé,
  # o custo típico subiu de ~11 para ~13 chamadas, e a remedição desfaz a
  # âncora.
  #
  # A folga de 100% existe porque a variação natural é de ±1 chamada e o
  # teto tem de pegar CURVA (o incidente foi 61 chamadas / 530.575 tokens).
  chamadas_ia_max: 26
  tokens_prompt_max: 113314
