id: cancelamento-correto
descricao: >
  Cliente cancela o PRÓPRIO agendamento — e o de outra pessoa, marcado no
  mesmo dia, tem de continuar intacto. `agendamentos: 1` sozinho só prova que
  o TOTAL caiu; não prova que caiu o agendamento certo (é a mesma categoria
  dos bugs de `nome_profissional` e linha órfã: o agregado batia, a linha
  errada é que estava errada). `agendamento_status` afere as DUAS linhas por
  nome: a do contato virou `cancelado`, a de Camila Rocha segue `ativo`.

tenant:
  service_duration_minutes: 60
  horario_manha_inicio: "08:00"
  horario_manha_fim: "12:00"

agenda_ocupada:
  # Agendamento de verdade de outra pessoa, no mesmo dia do contato — se a
  # Sofia cancelar a linha errada (ou cancelar as duas), este cenário pega.
  - data: "+2"
    horario: "14:00"
    duracao_minutos: 60
    titulo: "Atendimento - Camila Rocha"
    telefone: "5511999990002"

turnos:
  - "quero marcar um horário"
  - "depois de amanhã de manhã"
  - "às 10h"
  - "confirma, meu nome é Rafael Torres"
  - "na verdade preciso cancelar esse meu agendamento"
  - "sim, pode cancelar"

verificacoes:
  agendamentos: 1                    # só o da Camila continua ativo
  sem_agendamento_novo: true         # o do contato nasceu e morreu na mesma execução
  agendamento_status:
    - telefone: contato
      data: "+2"
      horario: "10:00"
      status: cancelado
    - telefone: "5511999990002"
      data: "+2"
      horario: "14:00"
      status: ativo
  # Tetos = 2 × o máximo medido em 3 passadas (2026-09-07,
  # google/gemini-3.7-flash, contra sofia-bot 0dc1e37 — a main com a
  # `prompt-condicional` em produção; `src/` é byte a byte igual ao
  # 1cfc2ee do merge, conferido por hash): chamadas 16/17/16, tokens de
  # prompt 51.640/53.750/51.571. Máximos: 17 e 53.750.
  #
  # RECALIBRADO contra o prompt novo, e SEM urgência — ao contrário dos
  # seis da v1. O teto anterior (145.988) dava folga de 2,72× contra este
  # mesmo prompt, acima dos 2× exigidos: a guarda estava inteira. Os dez
  # cenários de 05-07/09 estavam todos entre 2,08× e 2,87×; os da v1, cinco
  # dos seis abaixo de 2×. Entraram juntos para a suíte inteira passar a ter
  # teto medido contra o mesmo prompt e o mesmo SHA — comparar cenários com
  # tetos de bases diferentes é o que torna a folga difícil de ler.
  #
  # As três passadas correram com um `phone_number_id` por cenário
  # (`tenant.phone_number_id_do_cenario`).
  # A folga de 100% existe porque a variação natural é de ±1 chamada e o
  # teto tem de pegar CURVA (o incidente foi 61 chamadas / 530.575 tokens).
  chamadas_ia_max: 34
  tokens_prompt_max: 107500
