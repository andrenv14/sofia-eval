id: remarcacao
descricao: >
  Remarcar não pode duplicar a linha. Não existe ferramenta de "atualizar
  agendamento" — o prompt manda cancelar o antigo e criar o novo
  (systemPrompt.js, item 9: "use a ferramenta de cancelamento e depois, se for
  o caso, agende o novo horário"). Se a Sofia só criar o novo sem cancelar o
  velho, sobra agendamento duplicado: dois horários reservados, um só
  compareceria. `agendamentos: 1` pega o total (duplicou = 2); o horário do
  `agendamento` (que só olha o que é NOVO nesta execução) pega se o novo
  ficou no lugar certo.

tenant:
  service_duration_minutes: 60
  horario_manha_inicio: "08:00"
  horario_manha_fim: "12:00"

turnos:
  - "quero marcar um horário"
  - "quinta de manhã"
  - "às 9h"
  - "confirma, meu nome é Fernanda Costa"
  - "na verdade preciso mudar esse horário pra 11h, no mesmo dia"
  - "isso mesmo, pode confirmar às 11h"

verificacoes:
  agendamentos: 1            # se duplicou (criou sem cancelar), vira 2
  agendamento:
    horario: "11:00"
    duracao_minutos: 60
    telefone: contato
  # Tetos = 2 × o máximo medido em 3 passadas (2026-09-07,
  # google/gemini-3.7-flash, contra sofia-bot 0dc1e37 — a main com a
  # `prompt-condicional` em produção; `src/` é byte a byte igual ao
  # 1cfc2ee do merge, conferido por hash): chamadas 17/16/18, tokens de
  # prompt 55.291/51.997/58.499. Máximos: 18 e 58.499.
  #
  # RECALIBRADO contra o prompt novo, e SEM urgência — ao contrário dos
  # seis da v1. O teto anterior (167.818) dava folga de 2,87× contra este
  # mesmo prompt, acima dos 2× exigidos: a guarda estava inteira. Os dez
  # cenários de 05-07/09 estavam todos entre 2,08× e 2,87×; os da v1, cinco
  # dos seis abaixo de 2×. Entraram juntos para a suíte inteira passar a ter
  # teto medido contra o mesmo prompt e o mesmo SHA — comparar cenários com
  # tetos de bases diferentes é o que torna a folga difícil de ler.
  #
  # As três passadas correram com um `phone_number_id` por cenário (a224ad7).
  # A folga de 100% existe porque a variação natural é de ±1 chamada e o
  # teto tem de pegar CURVA (o incidente foi 61 chamadas / 530.575 tokens).
  chamadas_ia_max: 36
  tokens_prompt_max: 116998
