id: delegacao-fora-da-grade
descricao: >
  Pré-requisito de lançamento, par do `configuracao-multiprofissional` — dados
  fictícios de propósito, mesma decisão do fundador de 29/08.

  O que ele prova: pedido que cai num dos casos que a clínica NÃO agenda faz a
  Sofia chamar a ferramenta de atendente humano. Aferido pelo EFEITO —
  `contatos_estado.humano_pendente_desde` preenchido —, nunca pelo texto da
  resposta. É o campo que o painel do dono lê como selo "pendente de humano",
  então a asserção afirma exatamente o que o dono vê aparecer na fila dele.

  POR QUE É CENÁRIO SEPARADO, e não mais dois turnos no outro: **depois de
  delegar, o contato fica SILENCIADO.** `silenciarPorHandoff` grava
  `silenciado_ate` no futuro, e o gate do `sofia-bot` corta a mensagem
  seguinte ANTES da IA — ela é gravada em `messages` e nunca respondida nem
  enfileirada. Um turno depois da delegação nunca receberia resposta, o
  `enviar_turno` do eval esperaria até o timeout, e o cenário sairia ERRO por
  uma razão que não tem nada a ver com o que ele mede.

  Daí a regra, que vale para qualquer cenário futuro que afira delegação:
  **a delegação tem de ser a ÚLTIMA coisa da conversa.** Aqui isso é levado ao
  limite — um turno só.

  O turno único traz nome, serviço e preferência de uma vez, e isso é
  deliberado: a regra do tenant manda a Sofia colher os três antes de passar e
  perguntar o que faltar. Dando os três, não sobra nada para perguntar, e a
  delegação deve acontecer no primeiro turno. Se ela ainda assim pedir mais
  alguma coisa, o cenário reprova — e reprova com razão, porque a regra diz
  "numa mensagem só".

  ESTE CENÁRIO NASCE VERDE, mas a evidência aqui é FORTE, ao contrário da dos
  outros dois que nascem verdes. `agendamentos: 0` fica verde por várias
  causas; `humano_pendente: true` é asserção POSITIVA — exige que uma linha
  passe a existir. Não há como satisfazê-la por vacuidade: ou a ferramenta foi
  chamada e o efeito chegou ao banco, ou não foi.

  CONTROLE DE SENSIBILIDADE FEITO EM 06/09, e PASSOU. Contra `sofia-bot`
  1592748 sob `google/gemini-3.7-flash`:
    - COM a regra dos três casos: PASSOU (2 chamadas, 8.825 tokens);
    - SEM ela (parágrafo removido do `system_prompt_extra`): FALHOU, e pelo
      motivo certo — `humano_pendente` não apareceu em 5s, e a Sofia foi
      oferecer horários de sexta em vez de delegar. 5 chamadas, 21.823 tokens.

  Ou seja: o verde vem da regra, não de acaso, e a chave `humano_pendente`
  consegue acusar contra o servidor real — não só no autoteste. Refazer se o
  caminho de `silenciarPorHandoff` ou o guard de `coexistencia` mudarem.

  REFEITO EM 07/09, PORQUE O DE 06/09 NÃO SE SUSTENTAVA: o braço vermelho podia
  ter vindo da COLUNA, não da regra. Naquela data o eval usava um
  `phone_number_id` só para todos os cenários, e o `sofia-bot` cacheia o tenant
  por esse campo durante 30s. A rodada do braço "sem a regra" (06/09 22:31:28)
  saiu ~22s depois de uma rodada do `configuracao-multiprofissional`, que NÃO
  declara `coexistencia`. Herdando aquela coluna como `false`, a marca nunca
  seria escrita e este cenário daria vermelho COM regra ou SEM regra — que é
  precisamente o falso vermelho descrito logo abaixo. Ver
  `tenant.phone_number_id_do_cenario`.

  Refeito com os ids por cenário, contra `sofia-bot` 79c0715 sob
  `google/gemini-3.7-flash`. Base intacta: PASSOU, 2 chamadas / 9.423 tokens.
  Braço "sem a regra", 7 tentativas: NENHUMA VERDE — 1 FALHOU (5 chamadas /
  23.215 tokens; `humano_pendente` ausente e a Sofia a oferecer sexta-feira) e
  6 ERRO por turno degradado. Os seis degradados são ESGOTAMENTO DE ITERAÇÃO,
  não 429: zero ocorrências de `resposta sem choice utilizável` no log do
  servidor, e seis de `esgotou 5 iterações sem resposta final`, com o rastro
  `listar_profissionais, verificar_disponibilidade ×4`.

  O QUE ISSO DÁ E O QUE NÃO DÁ. Dá que o verde da base vem da regra: sem ela o
  cenário nunca fica verde, em sete tentativas. NÃO dá o 3/3 vermelho limpo que
  o protocolo pede, porque tirar a regra põe o modelo a sondar disponibilidade
  até esgotar as iterações — a condição quebrada produz SILÊNCIO, não uma
  resposta errada estável, e silêncio não é veredito. Fica escrito assim em vez
  de arredondado para "vermelho 3/3": medir o custo do fracasso com cara de
  número medido é o que esta seção existe para evitar.

  E NÃO INSISTA POR MAIS VERMELHOS — a instrução é para quem retomar, e é
  decisão da guia em 07/09. O braço quebrado não produz veredito estável POR
  CONSTRUÇÃO: sem a regra, o modelo não tem para onde ir senão sondar
  disponibilidade, e o esgotamento das iterações é o fim natural disso, não um
  acidente de rodada. Sete tentativas já sustentam o que interessa — o verde da
  base vem da regra, porque sem ela o cenário nunca fica verde. Arrancar 3/3 a
  repetir seria comprar um número com a aparência de medida e o conteúdo de
  teimosia. Um controle que declara o próprio limite vale mais.

  `tenant.coexistencia: true` é OBRIGATÓRIO e não é detalhe: o guard está em
  três camadas do `sofia-bot` (`chamarAtendenteHumano` só devolve
  `modo: 'coexistencia'` sob o if; `openrouter.js` só marca
  `efeitos.escalouParaHumano` nesse modo; só então `server.js` chama
  `silenciarPorHandoff`). Em tenant comum a linha NUNCA é escrita — não é
  escrita-e-ignorada, é nunca escrita — e este cenário daria falso vermelho.

tenant:
  coexistencia: true
  service_duration_minutes: 30
  slot_interval_minutes: 30
  horario_manha_inicio: "08:00"
  horario_manha_fim: "12:00"
  horario_tarde_inicio: "13:00"
  horario_tarde_fim: "18:00"
  system_prompt_extra: >-
    Esta clínica atende um paciente por vez. Escolha a agenda pelo SERVIÇO,
    nunca perguntando com qual profissional: canal e retratamento de canal vão
    para Endodontia; todo o resto vai para Clínica geral. Não pergunte ao
    paciente com quem ele quer marcar.

    NÃO agende, e não ofereça horário, nestes três casos: sábado em qualquer
    horário; quinta-feira a partir das 14h; criança com menos de 6 anos.
    Nesses casos faça o seguinte, nesta ordem: (1) garanta que você tem o nome
    completo do paciente, o serviço e o dia ou período que ele prefere —
    pergunte o que faltar, numa mensagem só; (2) diga que a clínica confirma
    esse horário direto com ele, por aqui mesmo; (3) chame a ferramenta de
    atendente humano e pare de atender. Nunca diga que a clínica não atende
    nesses casos: diga que a clínica confirma.
  profissionais:
    - nome: Clínica geral
      service_duration_minutes: 30
      # Grade de propósito SEM sábado — fiel ao tenant real, e é o que torna o
      # sábado um caso de delegação em vez de um horário indisponível
      # qualquer. A diferença importa: indisponível a Sofia recusaria sozinha;
      # delegado ela tem de passar para a equipe.
      grade:
        - { dia_semana: 1, hora_inicio: "14:00", hora_fim: "18:00" }
        - { dia_semana: 2, hora_inicio: "09:00", hora_fim: "12:00" }
        - { dia_semana: 2, hora_inicio: "14:00", hora_fim: "18:00" }
        - { dia_semana: 3, hora_inicio: "09:00", hora_fim: "12:00" }
        - { dia_semana: 3, hora_inicio: "14:00", hora_fim: "18:00" }
        - { dia_semana: 4, hora_inicio: "09:00", hora_fim: "12:00" }
        - { dia_semana: 5, hora_inicio: "09:00", hora_fim: "12:00" }
        - { dia_semana: 5, hora_inicio: "14:00", hora_fim: "18:00" }
    - nome: Endodontia
      service_duration_minutes: 60
      grade:
        - { dia_semana: 1, hora_inicio: "08:30", hora_fim: "11:30" }

turnos:
  # UM turno, e a razão está na descrição: depois de delegar o contato fica
  # silenciado, e um segundo turno morreria no gate sem resposta. Traz nome,
  # serviço e preferência juntos, que é o que a regra manda colher.
  - "oi, meu nome é Helena Braga, queria marcar uma limpeza no sábado de manhã"

verificacoes:
  # A asserção POSITIVA é a principal: a ferramenta foi chamada e o efeito
  # chegou ao banco. As duas negativas fecham o outro lado — delegar não pode
  # significar marcar assim mesmo.
  humano_pendente: true
  agendamentos: 0
  sem_agendamento_novo: true
  # Tetos = 2 × o máximo medido em 3 passadas (2026-09-07,
  # google/gemini-3.7-flash, contra sofia-bot 0dc1e37 — a main com a
  # `prompt-condicional` em produção; `src/` é byte a byte igual ao
  # 1cfc2ee do merge, conferido por hash): chamadas 2/2/2, tokens de
  # prompt 8.029/8.003/8.031. Máximos: 2 e 8.031.
  #
  # RECALIBRADO contra o prompt novo, e SEM urgência — ao contrário dos
  # seis da v1. O teto anterior (17.720) dava folga de 2,21× contra este
  # mesmo prompt, acima dos 2× exigidos: a guarda estava inteira. Os dez
  # cenários de 05-07/09 estavam todos entre 2,08× e 2,87×; os da v1, cinco
  # dos seis abaixo de 2×. Entraram juntos para a suíte inteira passar a ter
  # teto medido contra o mesmo prompt e o mesmo SHA — comparar cenários com
  # tetos de bases diferentes é o que torna a folga difícil de ler.
  #
  # As três passadas correram com um `phone_number_id` por cenário
  # (`tenant.phone_number_id_do_cenario`).
  # A folga de 100% existe porque a variação natural é de ±1 chamada e o
  # teto tem de pegar CURVA (o incidente foi 61 chamadas / 530.575 tokens).
  chamadas_ia_max: 4
  tokens_prompt_max: 16062
