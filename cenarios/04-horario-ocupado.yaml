id: horario-ocupado
descricao: >
  Não pode marcar em cima de compromisso que já existe na agenda —
  inclusive quando ele não veio da assistente (o dono marcou à mão).

tenant:
  service_duration_minutes: 60
  horario_manha_inicio: "08:00"
  horario_manha_fim: "12:00"

agenda_ocupada:
  - data: "+2"
    horario: "10:00"
    duracao_minutos: 60
    titulo: "Reunião interna"

turnos:
  - "quero marcar depois de amanhã às 10h da manhã"
  - "pode confirmar às 10h mesmo, meu nome é Carla Dias"

verificacoes:
  agendamentos: 0
  sem_agendamento_novo: true
  # Tetos = 2 × o máximo medido em 3 passadas (2026-08-25,
  # google/gemini-3.7-flash): 7 chamadas, 27.277 tokens de prompt.
  # A folga de 100% existe porque a variação natural é de ±1 chamada e o
  # teto tem de pegar CURVA (o incidente foi 61 chamadas / 530.575 tokens).
  chamadas_ia_max: 14
  tokens_prompt_max: 55000
