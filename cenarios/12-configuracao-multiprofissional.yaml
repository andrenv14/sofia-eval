id: configuracao-multiprofissional
descricao: >
  Pré-requisito de lançamento de um tenant real com 4 profissionais e agenda
  única — dados fictícios de propósito (decisão do fundador, 29/08: entra
  sem os dados reais do cliente que este cenário protege; nome do cliente
  não pertence a repositório versionado, nem como identificador de cenário).

  Prova UMA coisa, e de propósito: o nome resolve para o profissional CERTO,
  com a duração DELE — não a do tenant nem a de outro profissional.

  CORREÇÃO (03/09): a versão anterior deste cenário afirmava uma segunda
  coisa — que dois profissionais diferentes podem ser marcados no MESMO
  horário sem colisão — e estava ERRADA. `getBusyIntervals`
  (`googleCalendar.js`) lista o dia inteiro do calendário resolvido e **não
  filtra por profissional**. E o calendário resolvido é o MESMO para todos:
  `tenant.py` grava `cfg.google_calendar_id` em cada linha de `professionals`,
  então `resolveCalendarId` toma o ramo do profissional (não o do tenant) e
  devolve o mesmo id para qualquer um deles. Ou seja: neste repositório todo
  cenário tem AGENDA ÚNICA, e nela o segundo profissional colide com o evento
  do primeiro. O agendamento semeado abaixo foi movido
  para as 11h justamente por isso — às 9h ele bloquearia a marcação com a
  Beatriz e o cenário reprovaria por um motivo que não é o que ele mede.
  Quem afere a colisão entre profissionais, exigindo a recusa, é o
  `agenda-unica-um-por-vez`.

  Exercita `agenda_ocupada[].profissional` pela primeira vez na leva — README
  já documentava a chave, mas nenhum cenário da v1 a usava (achado da fila,
  27/08). `profissional:` é OBRIGATÓRIO neste item: sem ele, `agenda.py`
  insere `professional_id` nulo, e a trigger `BEFORE INSERT` da camada 4 de
  `nome-profissional-obrigatorio.md` recusa isso com erro cru de Postgres —
  a semeadura estoura antes do primeiro turno.

  FORA deste cenário, mas não mais impossível: grade e exceção por
  profissional. Desde a semeadura de `professional_availability` /
  `_exceptions` (chaves `grade` e `excecoes` em `tenant.profissionais[]`),
  quem prova esse lado é o `grade-do-profissional`. Aqui os quatro seguem
  SEM grade de propósito — profissional sem nenhuma linha não é restringido
  (`temGradeConfigurada`), e é isso que mantém este cenário medindo só
  resolução de nome e duração, sem a grade interferir no veredito.

tenant:
  service_duration_minutes: 30
  slot_interval_minutes: 30
  horario_manha_inicio: "08:00"
  horario_manha_fim: "12:00"
  profissionais:
    - nome: Beatriz
      service_duration_minutes: 45
    - nome: Carlos
      service_duration_minutes: 30
    - nome: Denise
      service_duration_minutes: 60
    - nome: Eduardo
      service_duration_minutes: 30

agenda_ocupada:
  # Agendamento de verdade de outra pessoa, com a Denise, em horário que NÃO
  # conflita com o que o contato vai marcar (11h contra 9h). Agenda única:
  # se estivesse às 9h, bloquearia a Beatriz — ver a correção na descrição.
  - data: "+2"
    horario: "11:00"
    duracao_minutos: 60
    titulo: "Atendimento - Fernanda Lopes"
    telefone: "5511999990006"
    profissional: Denise

turnos:
  - "quero marcar com a beatriz"
  - "depois de amanhã às 9h"
  - "confirma, meu nome é Gustavo Ramos"

verificacoes:
  agendamentos: 2               # a da Denise (terceiro, intocada) + a nova da Beatriz
  agendamento:
    profissional: Beatriz
    duracao_minutos: 45         # duração DELA — não 30 (tenant/Carlos/Eduardo), não 60 (Denise)
    horario: "09:00"
    telefone: contato
  # Tetos = 2 × o máximo medido em 3 passadas (2026-09-05,
  # google/gemini-3.7-flash, contra sofia-bot 45dc8e8): chamadas 8/9/8, tokens de prompt
  # 33.837/38.214/33.397. Máximos: 9 e 38.214.
  # A folga de 100% existe porque a variação natural é de ±1 chamada e o
  # teto tem de pegar CURVA (o incidente foi 61 chamadas / 530.575 tokens).
  chamadas_ia_max: 18
  tokens_prompt_max: 76428
