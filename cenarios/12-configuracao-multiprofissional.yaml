id: configuracao-multiprofissional
descricao: >
  Pré-requisito de lançamento de um tenant real — dados fictícios de propósito
  (decisão do fundador, 29/08: entra sem os dados reais do cliente que este
  cenário protege; nome de cliente, de profissional e de convênio não
  pertencem a repositório versionado, nem como identificador de cenário).

  REESCRITO EM 06/09. A versão anterior protegia um desenho que não foi o
  aplicado: quatro profissionais com nome de gente, e o cenário provava que o
  NOME resolvia para o profissional certo. O desenho que foi ao ar em 06/09 é
  outro, e é o que precisa de guarda:

  **as linhas de agenda não são pessoas, são SERVIÇOS**, e o roteamento é pelo
  serviço pedido — nunca perguntando ao paciente com quem ele quer marcar.

  O que este cenário prova, e é UMA coisa: pedido de canal roteia para a linha
  de Endodontia, e não para a Clínica geral.

  COMO ele prova, e a escolha é o que o torna determinístico: pela DURAÇÃO.
  Endodontia atende em 60 minutos e a Clínica geral em 30. Se o agendamento
  nasce com 60, foi para a linha certa. Isso não depende do dia em que a
  rodada acontece — e depender do dia seria fatal aqui, porque a Endodontia só
  tem grade às SEGUNDAS de manhã. Uma asserção por data exigiria que o eval
  soubesse mirar dia da semana, o que `datas.resolver` não faz (aceita só
  'AAAA-MM-DD', '+N' e 'hoje'). A duração contorna isso sem enfraquecer nada:
  ela é o efeito que separa as duas linhas.

  CONTROLE DE SENSIBILIDADE, 06/09 — os dois lados foram exercidos, e o
  resultado NÃO é o esperado. Fica escrito por inteiro, porque metade dele
  enfraquece o que este cenário pode alegar.

  1. **Quebrando a ASSERÇÃO (duração da Endodontia 60 → 30): FICOU VERMELHO.**
     `agendamento.duracao_minutos: esperado 60, obtido 30`. A asserção não é
     decoração — ela consegue acusar.

  2. **Quebrando a REGRA DE ROTEAMENTO (parágrafo removido do
     `system_prompt_extra`): FICOU VERDE.** A Sofia mandou o canal para a
     Endodontia do mesmo jeito. O nome da linha carrega o mapeamento sozinho —
     "canal" e "Endodontia" são a mesma coisa em qualquer contexto
     odontológico, e o modelo não precisou da instrução.

  O QUE ISSO SIGNIFICA, sem maquiagem: **este cenário NÃO é guarda da regra de
  roteamento.** Se alguém apagar aquele parágrafo do prompt do tenant real,
  este cenário continua verde e não avisa ninguém. Dizer o contrário seria
  vender uma proteção que ele não dá.

  O que ele guarda, e continua valendo para o lançamento: o EFEITO. Que o
  pedido de canal termina numa linha de 60 minutos chamada Endodontia. Isso
  reprova se a grade for mal configurada, se a duração por linha deixar de ser
  aplicada, se `resolveCalendarId` mudar de ramo, ou se a Sofia passar a
  perguntar "com quem". São regressões estruturais, e são as que quebram o
  cliente — a instrução do prompt é cinto sobre suspensório.

  Para ele virar guarda da REGRA seria preciso tirar a pista do nome (linhas
  chamadas "Linha A" e "Linha B", por exemplo). Isso mediria outra coisa, e o
  nome real do tenant é o que está no ar — mudá-lo tornaria o cenário infiel à
  configuração que ele existe para proteger. Fica registrado como escolha, não
  como esquecimento.

  O QUE O VERDE DAQUI NÃO DIZ: que a Sofia escolheu a linha pelo motivo certo.
  O controle 2 acima é a prova disso, e não uma suspeita. O que o verde afirma
  é o efeito — a linha certa, com a duração dela. Não afirma nada sobre
  convênio, preço ou os casos delegados; esses são de outros cenários.

  Escopo do `system_prompt_extra` abaixo, e por que ele não é a cópia do real:
  entram as regras ESTRUTURAIS (roteamento por serviço, a janela da
  Endodontia, os três casos que não se agenda). Ficam de fora as regras
  conversacionais do tenant real — pedir nome, idade e convênio no início,
  a lista de planos, a proibição de preço. Elas alongariam a conversa sem
  mudar o que este cenário afere, e cada turno é uma chamada real de LLM.
  Quem quiser guarda para elas escreve cenário próprio.

tenant:
  # 30 min é o padrão do NEGÓCIO; a Endodontia sobrescreve para 60. É essa
  # diferença que a asserção lê.
  service_duration_minutes: 30
  slot_interval_minutes: 30
  horario_manha_inicio: "08:00"
  horario_manha_fim: "12:00"
  horario_tarde_inicio: "13:00"
  horario_tarde_fim: "18:00"
  system_prompt_extra: >-
    Esta clínica atende um paciente por vez. Escolha a agenda pelo SERVIÇO,
    nunca perguntando com qual profissional: canal e retratamento de canal vão
    para Endodontia; todo o resto vai para Clínica geral. Não pergunte ao
    paciente com quem ele quer marcar.

    Canal e retratamento de canal (Endodontia) só têm horário às
    SEGUNDAS-FEIRAS DE MANHÃ, das 08:30 às 11:30 — nunca à tarde, nunca em
    outro dia. Se o paciente pedir canal em outro dia ou período, diga isso de
    uma vez e ofereça a próxima segunda de manhã; NÃO verifique
    disponibilidade em outros dias. Se verificar disponibilidade e voltar sem
    horário, não tente outro dia por conta própria: diga ao paciente o que
    encontrou e pergunte o que ele prefere.

    NÃO agende, e não ofereça horário, nestes três casos: sábado em qualquer
    horário; quinta-feira a partir das 14h; criança com menos de 6 anos.
    Nesses casos colha nome, serviço e preferência, diga que a clínica
    confirma direto com o paciente por aqui, chame a ferramenta de atendente
    humano e pare de atender.
  profissionais:
    # NOMES DE SERVIÇO, não de pessoa — é o desenho aplicado, e é o que o
    # roteamento por serviço exige. Os dois compartilham o mesmo calendário
    # (o eval sempre grava o mesmo `google_calendar_id` em todos), então um
    # evento numa linha bloqueia a outra. Isso é fiel ao tenant real, onde as
    # duas linhas também estão no mesmo `primary`.
    - nome: Clínica geral
      service_duration_minutes: 30
      grade:
        - { dia_semana: 1, hora_inicio: "14:00", hora_fim: "18:00" }
        - { dia_semana: 2, hora_inicio: "09:00", hora_fim: "12:00" }
        - { dia_semana: 2, hora_inicio: "14:00", hora_fim: "18:00" }
        - { dia_semana: 3, hora_inicio: "09:00", hora_fim: "12:00" }
        - { dia_semana: 3, hora_inicio: "14:00", hora_fim: "18:00" }
        - { dia_semana: 4, hora_inicio: "09:00", hora_fim: "12:00" }
        - { dia_semana: 5, hora_inicio: "09:00", hora_fim: "12:00" }
        - { dia_semana: 5, hora_inicio: "14:00", hora_fim: "18:00" }
    # Segunda de manhã, e só. A janela estreita é o ponto: é ela que fez o
    # modelo sondar disponibilidade quatro vezes em produção (06/09) até
    # esgotar as 5 iterações, porque `listar_profissionais` devolve só nomes e
    # a checagem por período volta vazia sem dizer o motivo. O teto de custo
    # deste cenário é a guarda contra essa volta: esgotar iterações estoura
    # `chamadas_ia_max` muito antes de virar sintoma na conversa.
    - nome: Endodontia
      service_duration_minutes: 60
      grade:
        - { dia_semana: 1, hora_inicio: "08:30", hora_fim: "11:30" }

turnos:
  # O nome vem no primeiro turno de propósito, para a conversa não gastar um
  # turno inteiro só a colhê-lo. O pedido NÃO diz "com quem" nem cita a linha:
  # dizer "quero marcar na Endodontia" tornaria o roteamento trivial e o
  # cenário deixaria de medir o que afirma medir.
  - "oi, meu nome é Marcos Vieira e eu preciso fazer um canal"
  # Nomeia a hora de propósito. A primeira tentativa dizia "pode confirmar esse
  # horário" e o cenário reprovou sem medir nada: a Sofia tinha oferecido TRÊS
  # (08h30, 09h30, 10h30 — os três slots de 60 min da janela da Endodontia) e
  # esperava uma escolha. O roteamento já estava certo ali; o roteiro é que
  # era curto. 08h30 é determinístico: é sempre o primeiro slot da janela, em
  # qualquer segunda, com o dia livre.
  - "pode ser às 8h30 então"

verificacoes:
  # A DURAÇÃO é a asserção, e é ela que separa as duas linhas: 60 é
  # Endodontia, 30 seria Clínica geral. `profissional` confirma pelo nome, e
  # os dois juntos fecham a porta de o agendamento ter nascido certo por um
  # caminho errado.
  agendamentos: 1
  agendamento:
    duracao_minutos: 60
    profissional: Endodontia
  # Tetos de custo ainda NÃO medidos — pendente 3 passadas sob o modelo
  # declarado. O cenário mudou de forma em 06/09 e os tetos da versão
  # anterior (18 / 76.428) não valem para ele: mediam outra conversa.
