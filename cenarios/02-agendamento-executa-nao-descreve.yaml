id: agendamento-executa-nao-descreve
descricao: >
  Confirmação tem de virar linha em appointments. Se a assistente
  escrever que agendou sem chamar a ferramenta, o banco denuncia.

tenant:
  service_duration_minutes: 60

turnos:
  - "quero marcar um horário"
  - "pode ser na segunda-feira da semana que vem, de manhã"
  - "às 10h"
  - "confirma, meu nome é João Silva"

verificacoes:
  agendamentos: 1
  agendamento:
    duracao_minutos: 60
    horario: "10:00"
    telefone: contato
  # Tetos = 2 × o máximo medido em 3 passadas (2026-08-25,
  # google/gemini-3.7-flash): 10 chamadas, 38.524 tokens de prompt.
  # A folga de 100% existe porque a variação natural é de ±1 chamada e o
  # teto tem de pegar CURVA (o incidente foi 61 chamadas / 530.575 tokens).
  chamadas_ia_max: 20
  tokens_prompt_max: 78000
