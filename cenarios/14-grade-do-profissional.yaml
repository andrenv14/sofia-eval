id: grade-do-profissional
descricao: >
  A grade do profissional VALE, e exceção pontual vence a regra recorrente.
  Este é o cenário que a fila registrou como "grade ignorada sem
  profissional" — só que pelo lado que ainda dá pra provar. O bug original
  (profissional não resolvido ⇒ `carregarGradeProfissional` com id falsy ⇒
  grade inteira ignorada) parece fechado desde a camada 4 de
  `nome-profissional-obrigatorio.md` (28/08): `resolverProfissionalObrigatorio`
  (`ai/tools.js`) recusa a ferramenta quando falta `nome_profissional` em
  tenant com profissional cadastrado, então `professional` nulo só sobra em
  tenant SEM profissional nenhum — onde ignorar a grade é o certo, não o bug.
  Isso é leitura de código, não veredito: a fila mantém o item aberto até a
  investigação original ser reaberta. Enquanto isso, aqui fica a guarda de
  regressão, que nasce VERDE de propósito.

  VALIDADO COMO GUARDA EM 05/09 — controle de sensibilidade FEITO e PASSOU.
  Antes disso, dizer que "se a grade voltar a ser ignorada ele fica vermelho"
  era PREVISÃO, não medição, porque `agendamentos: 0` fica verde igual se a
  grade for respeitada, se a ferramenta recusar por outro motivo, ou se o
  modelo não tentar nada. Agora foi medido, contra `sofia-bot` 45dc8e8 (main
  deployada) e modelo google/gemini-3.7-flash:

    - SEM a exceção `bloqueio` (removida de propósito): FALHOU, e pelas DUAS
      asserções — `agendamentos` obtido 1 e `sem_agendamento_novo` obtido 1,
      com a linha `2026-09-07 09:00 (60min, Helena)` no banco. A assistente
      confirmou por escrito. 6 chamadas, 25.348 tokens de prompt.
    - COM a exceção restaurada: PASSOU. 8 chamadas, 34.001 tokens.

  Ou seja: a grade É consultada, a exceção pontual VENCE a regra recorrente, e
  a asserção mede o que afirma medir. Refazer o controle se
  `carregarGradeProfissional` ou `horarioContinuaLivre` mudarem de caminho.

  Histórico que explica por que demorou: seis tentativas em 03/09 não
  concluíram — todas envenenadas por 429 intermitente, e a primeira delas
  produziu um VERDE FALSO que originou a trava de turno degradado
  (`eefc598` + `ccee07f`).

  Determinismo, que é o que torna este cenário possível: a regra recorrente
  cobre os SETE dias da semana, então não importa em que dia a rodada
  acontece; e o bloqueio é numa data relativa (`+2`), não num dia da semana.
  A grade é consultada nos DOIS caminhos — na oferta (`checkAvailability`) e
  na criação (`horarioContinuaLivre`, chamada por `createEvent`,
  `googleCalendar.js`) —, então o veredito não depende de o modelo checar
  disponibilidade antes de tentar marcar.

tenant:
  service_duration_minutes: 60
  horario_manha_inicio: "08:00"
  horario_manha_fim: "12:00"
  profissionais:
    - nome: Helena
      service_duration_minutes: 60
      # Sete linhas de propósito: com a regra cobrindo todo dia, o único
      # motivo possível de recusa às 9h de `+2` é a exceção abaixo — não "hoje
      # calhou de cair num dia sem regra".
      grade:
        - { dia_semana: 0, hora_inicio: "08:00", hora_fim: "18:00" }
        - { dia_semana: 1, hora_inicio: "08:00", hora_fim: "18:00" }
        - { dia_semana: 2, hora_inicio: "08:00", hora_fim: "18:00" }
        - { dia_semana: 3, hora_inicio: "08:00", hora_fim: "18:00" }
        - { dia_semana: 4, hora_inicio: "08:00", hora_fim: "18:00" }
        - { dia_semana: 5, hora_inicio: "08:00", hora_fim: "18:00" }
        - { dia_semana: 6, hora_inicio: "08:00", hora_fim: "18:00" }
      excecoes:
        # Folga pontual: fecha exatamente o slot que a regra recorrente
        # abriria. Exceção tem prioridade sobre a regra (availability.js).
        - data: "+2"
          hora_inicio: "09:00"
          hora_fim: "10:00"
          tipo: bloqueio

turnos:
  # O nome da profissional é repetido no turno de confirmação de propósito.
  # Sem ele, o modelo pode chamar a ferramenta sem `nome_profissional`, e aí
  # `resolverProfissionalObrigatorio` recusa ANTES de a grade ser consultada —
  # o cenário ficaria verde sem ter exercitado o que ele guarda.
  - "quero marcar com a helena depois de amanhã às 9h"
  - "pode confirmar às 9h com a helena mesmo, meu nome é Marcos Vieira"

verificacoes:
  # Verde AQUI é evidência fraca por natureza: "nenhum agendamento" é o mesmo
  # resultado de várias causas — grade respeitada (o que se quer), recusa por
  # `nome_profissional` faltando, ou o modelo simplesmente não tentando. O que
  # separa é o dossiê: transcrição no relatório HTML, e — quando falha — a
  # grade semeada no JSON de evidência, que passou a capturar
  # `professional_availability` e as exceções justamente por causa deste
  # cenário. Vermelho aqui, sim, é inequívoco: a grade foi ignorada.
  agendamentos: 0
  sem_agendamento_novo: true
  # Tetos = 2 × o máximo medido em 3 passadas (2026-09-07,
  # google/gemini-3.7-flash, contra sofia-bot 0dc1e37 — a main com a
  # `prompt-condicional` em produção; `src/` é byte a byte igual ao
  # 1cfc2ee do merge, conferido por hash): chamadas 7/7/7, tokens de
  # prompt 24.442/24.752/24.631. Máximos: 7 e 24.752.
  #
  # RECALIBRADO contra o prompt novo, e SEM urgência — ao contrário dos
  # seis da v1. O teto anterior (68.002) dava folga de 2,75× contra este
  # mesmo prompt, acima dos 2× exigidos: a guarda estava inteira. Os dez
  # cenários de 05-07/09 estavam todos entre 2,08× e 2,87×; os da v1, cinco
  # dos seis abaixo de 2×. Entraram juntos para a suíte inteira passar a ter
  # teto medido contra o mesmo prompt e o mesmo SHA — comparar cenários com
  # tetos de bases diferentes é o que torna a folga difícil de ler.
  #
  # As três passadas correram com um `phone_number_id` por cenário (a224ad7).
  # A folga de 100% existe porque a variação natural é de ±1 chamada e o
  # teto tem de pegar CURVA (o incidente foi 61 chamadas / 530.575 tokens).
  chamadas_ia_max: 14
  tokens_prompt_max: 49504
