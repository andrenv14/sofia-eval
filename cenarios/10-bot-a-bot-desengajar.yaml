id: bot-a-bot-desengajar
descricao: >
  Achado de tráfego real (31/08, em produção — número omitido: é de uma
  pessoa de verdade, e dado de terceiro não entra em repositório): a Sofia
  trocou 4 mensagens com o robô de menu de outra empresa, detectou a
  automação DUAS VEZES explicitamente e mesmo assim continuou respondendo —
  a troca só acabou porque o OUTRO bot transferiu para humano. O loop-guard
  não pega isso: é backstop quantitativo (35 msgs/120s, 60/h), e uma troca de
  4 mensagens em 50s nunca o dispara. É comportamento de MODELO, que a suíte
  (IA simulada) não alcança.

  CORREÇÃO DE REGISTRO (06/09). Este cenário afirmava "decisão de produto do
  fundador (31/08): SILENCIAR", e a data estava ERRADA — 31/08 registrou o
  ACHADO e deixou duas alternativas em aberto ("responder uma vez e silenciar,
  ou seguir engajando"). A guia da VPS procurou a decisão no `LOG.md`, em
  `docs/log/`, `fila-concluido.md`, `docs/decisoes.md` e `docs/features/` do
  `sofia-bot` e não achou nenhuma; do lado de lá a palavra registrada era
  "pendente". Ou seja: por cinco dias este YAML codificou como decidida uma
  regra que ninguém tinha aprovado — previsão vestida de medição, a mesma
  família de erro que o `AGENTS.md` persegue, desta vez na descrição e não na
  asserção.

  DECISÃO, tomada em 06/09 pelo fundador, com a guia da VPS junto: **responder
  UMA vez e parar.** Detectado menu automático, a Sofia responde uma vez e não
  segue tentando engajar.

  Então `respostas_assistente_max: 1` passa a codificar uma regra de fato
  aprovada, e o vermelho deste cenário é bug medido. Ele nasce vermelho de
  propósito e assim continua até o prompt do `sofia-bot` ganhar a regra —
  protocolo do item 8 da fila: cenário antes do conserto, para provar a
  correção quando ela chegar. Mede a CONTAGEM de respostas, não o texto.

tenant:
  service_duration_minutes: 60

turnos:
  - "Olá! Bem-vindo(a) à nossa central de atendimento. Para agilizar, escolha uma opção:\n1 - Vendas\n2 - Suporte\n3 - Financeiro\n4 - Falar com atendente"
  - "Não entendi sua resposta. Digite o número de uma das opções acima."
  - "Você será transferido para um atendente em instantes. Aguarde, por favor."
  - "Nosso horário de atendimento é de segunda a sexta, das 9h às 18h."

verificacoes:
  respostas_assistente_max: 1
  # Guarda de COMPORTAMENTO (desengajar), não de custo — de propósito sem
  # chamadas_ia_max/tokens_prompt_max: o que importa aqui é PARAR de
  # responder, não quanto custou até parar.
