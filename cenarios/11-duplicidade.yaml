id: duplicidade
descricao: >
  Pedir o mesmo horário duas vezes (reentrega de mensagem, duplo toque,
  reconexão) não pode virar duas linhas em `appointments`. `createEvent`
  trata isso por dentro — `INSERT ... ON CONFLICT (tenant_id, professional_id,
  inicio, fim) WHERE status='ativo' DO NOTHING`, e se a linha existente já é
  do MESMO telefone, devolve o evento já criado em vez de tentar duplicar
  (`googleCalendar.js`, bloco de `reserva`/`respostaJaExistia`). Mas isso só
  prova alguma coisa se o MODELO também não inventar uma segunda confirmação
  por conta própria — e só o eval, com IA real, prova os dois lados ao mesmo
  tempo. Robusto ao caminho que o modelo escolher: se ele reconhecer "você já
  confirmou" sem chamar a ferramenta de novo, ou se chamar de novo e o banco
  segurar pela idempotência, o resultado no banco é o mesmo — só falha se de
  fato aparecer uma segunda linha.

tenant:
  service_duration_minutes: 60
  horario_manha_inicio: "08:00"
  horario_manha_fim: "12:00"

turnos:
  - "quero marcar um horário"
  - "quinta de manhã"
  - "às 9h"
  - "confirma, meu nome é Juliana Prado"
  - "confirma, meu nome é Juliana Prado"

verificacoes:
  agendamentos: 1
  agendamento:
    horario: "09:00"
    duracao_minutos: 60
    telefone: contato
  # Tetos = 2 × o máximo medido em 3 passadas (2026-09-07,
  # google/gemini-3.7-flash, contra sofia-bot 0dc1e37 — a main com a
  # `prompt-condicional` em produção; `src/` é byte a byte igual ao
  # 1cfc2ee do merge, conferido por hash): chamadas 14/13/15, tokens de
  # prompt 44.434/41.165/48.376. Máximos: 15 e 48.376.
  #
  # RECALIBRADO contra o prompt novo, e SEM urgência — ao contrário dos
  # seis da v1. O teto anterior (129.294) dava folga de 2,67× contra este
  # mesmo prompt, acima dos 2× exigidos: a guarda estava inteira. Os dez
  # cenários de 05-07/09 estavam todos entre 2,08× e 2,87×; os da v1, cinco
  # dos seis abaixo de 2×. Entraram juntos para a suíte inteira passar a ter
  # teto medido contra o mesmo prompt e o mesmo SHA — comparar cenários com
  # tetos de bases diferentes é o que torna a folga difícil de ler.
  #
  # As três passadas correram com um `phone_number_id` por cenário
  # (`tenant.phone_number_id_do_cenario`).
  # A folga de 100% existe porque a variação natural é de ±1 chamada e o
  # teto tem de pegar CURVA (o incidente foi 61 chamadas / 530.575 tokens).
  chamadas_ia_max: 30
  tokens_prompt_max: 96752
